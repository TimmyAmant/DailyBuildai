<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmic Canvas · DailyBuildAI #1 · Feb 24, 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    cursor: crosshair;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    user-select: none;
  }

  canvas { display: block; }

  /* HUD */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    pointer-events: none;
    z-index: 10;
  }

  .hud-back {
    display: flex;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.5);
    font-size: 0.8rem;
    pointer-events: all;
    text-decoration: none;
    transition: color 0.2s;
    padding: 4px 0;
  }

  .hud-back:hover { color: rgba(255,255,255,0.9); }

  .hud-back svg { flex-shrink: 0; }

  .hud-title {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hud-badge {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(99,102,241,0.3);
    border: 1px solid rgba(99,102,241,0.5);
    color: #818cf8;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .hud-date { font-size: 0.75rem; color: rgba(255,255,255,0.4); }

  /* Bottom bar */
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 16px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }

  .hint {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.3);
    display: flex;
    gap: 18px;
  }

  .hint span { display: flex; align-items: center; gap: 5px; }

  .key {
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.5);
  }

  /* Theme picker */
  #themePicker {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
    pointer-events: all;
  }

  .theme-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s;
  }

  .theme-dot:hover { transform: scale(1.3); }
  .theme-dot.active { border-color: rgba(255,255,255,0.8); transform: scale(1.2); }

  /* Particle count */
  #stats {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.2);
    font-variant-numeric: tabular-nums;
    font-family: monospace;
  }

  /* Click ripple */
  .ripple {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    pointer-events: none;
    animation: rippleOut 0.6s ease-out forwards;
    z-index: 5;
  }

  @keyframes rippleOut {
    from { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-title">
    <a class="hud-back" href="/" title="Back to DailyBuildAI">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    ✦ Cosmic Canvas
    <span class="hud-badge">DailyBuild #1</span>
  </div>
  <div class="hud-date">Feb 24, 2026</div>
</div>

<div id="themePicker"></div>

<div id="controls">
  <div class="hint">
    <span><kbd class="key">click</kbd> explode</span>
    <span><kbd class="key">T</kbd> theme</span>
    <span><kbd class="key">C</kbd> clear</span>
    <span><kbd class="key">Space</kbd> pause</span>
  </div>
  <div id="stats">0 particles</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const pickerEl = document.getElementById('themePicker');

// ── Themes ───────────────────────────────────────────
const THEMES = [
  {
    name: 'Nebula',
    bg: '#000005',
    dot: '#6366f1',
    palettes: [
      ['#818cf8','#a78bfa','#c4b5fd','#e0e7ff','#ddd6fe'],
      ['#6366f1','#8b5cf6','#a855f7','#ec4899','#f43f5e'],
      ['#38bdf8','#818cf8','#a78bfa','#f0abfc','#fbcfe8'],
    ]
  },
  {
    name: 'Solar',
    bg: '#050200',
    dot: '#f59e0b',
    palettes: [
      ['#fef3c7','#fde68a','#fcd34d','#fbbf24','#f59e0b'],
      ['#fed7aa','#fdba74','#fb923c','#f97316','#ea580c'],
      ['#fff7ed','#ffedd5','#fef3c7','#fde68a','#fcd34d'],
    ]
  },
  {
    name: 'Aurora',
    bg: '#000a05',
    dot: '#10b981',
    palettes: [
      ['#6ee7b7','#34d399','#10b981','#059669','#047857'],
      ['#a7f3d0','#6ee7b7','#34d399','#38bdf8','#818cf8'],
      ['#ccfbf1','#99f6e4','#5eead4','#2dd4bf','#14b8a6'],
    ]
  },
  {
    name: 'Inferno',
    bg: '#050000',
    dot: '#ef4444',
    palettes: [
      ['#fca5a5','#f87171','#ef4444','#dc2626','#b91c1c'],
      ['#fed7aa','#fca5a5','#f87171','#ef4444','#e11d48'],
      ['#fef9c3','#fef08a','#fde047','#facc15','#f59e0b'],
    ]
  },
  {
    name: 'Void',
    bg: '#000000',
    dot: '#e2e8f0',
    palettes: [
      ['#f8fafc','#e2e8f0','#cbd5e1','#94a3b8','#64748b'],
      ['#ffffff','#e2e8f0','#cbd5e1','#94a3b8','#475569'],
      ['#f0f9ff','#e0f2fe','#bae6fd','#7dd3fc','#38bdf8'],
    ]
  },
];

let themeIndex = 0;
let currentTheme = THEMES[0];
let currentPalette = 0;

// Build theme dots
THEMES.forEach((t, i) => {
  const dot = document.createElement('div');
  dot.className = 'theme-dot' + (i === 0 ? ' active' : '');
  dot.style.background = t.dot;
  dot.title = t.name;
  dot.addEventListener('click', () => setTheme(i));
  pickerEl.appendChild(dot);
});

function setTheme(i) {
  themeIndex = i;
  currentTheme = THEMES[i];
  currentPalette = 0;
  document.querySelectorAll('.theme-dot').forEach((d, j) => {
    d.classList.toggle('active', j === i);
  });
}

// ── Resize ────────────────────────────────────────────
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Particle system ───────────────────────────────────
const particles = [];
const stars = [];
let paused = false;
let frame = 0;

// Generate ambient stars
function initStars() {
  const count = Math.floor((canvas.width * canvas.height) / 6000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      alpha: Math.random() * 0.6 + 0.1,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2,
    });
  }
}
initStars();

class Particle {
  constructor(x, y, palette) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 1;
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (Math.random() * 3);
    this.r = Math.random() * 3 + 0.5;
    this.alpha = 1;
    this.decay = Math.random() * 0.012 + 0.006;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.gravity = 0.08 + Math.random() * 0.04;
    this.trail = [];
    this.maxTrail = Math.floor(Math.random() * 8 + 4);
    this.glow = Math.random() > 0.6;
  }

  update() {
    this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    this.vx *= 0.98;
    this.vy += this.gravity;
    this.vy *= 0.99;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }

  draw(ctx) {
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const ratio = i / this.trail.length;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.r * ratio * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = this.color + Math.floor(t.alpha * ratio * 80).toString(16).padStart(2, '0');
      ctx.fill();
    }

    if (this.glow) {
      ctx.save();
      ctx.shadowColor = this.color;
      ctx.shadowBlur = this.r * 8;
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(this.alpha * 255).toString(16).padStart(2, '0');
    ctx.fill();

    if (this.glow) ctx.restore();
  }

  get dead() { return this.alpha <= 0; }
}

// Ambient drifter particles (always present)
class Drifter {
  constructor() { this.reset(true); }

  reset(initial = false) {
    this.x = initial ? Math.random() * canvas.width : -20;
    this.y = Math.random() * canvas.height;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.vx = Math.random() * 0.4 + 0.1;
    this.r = Math.random() * 1.5 + 0.3;
    this.alpha = Math.random() * 0.4 + 0.05;
    this.color = currentTheme.palettes[0][Math.floor(Math.random() * 5)];
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x > canvas.width + 20) this.reset();
  }

  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(this.alpha * 255).toString(16).padStart(2, '0');
    ctx.fill();
  }
}

const drifters = Array.from({ length: 80 }, () => new Drifter());

// Explode at point
function explode(x, y) {
  const palette = currentTheme.palettes[currentPalette % currentTheme.palettes.length];
  const count = 60 + Math.floor(Math.random() * 40);
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, palette));
  }
  currentPalette++;

  // Ripple
  const rip = document.createElement('div');
  rip.className = 'ripple';
  rip.style.cssText = `left:${x}px;top:${y}px;width:60px;height:60px;border-color:${palette[0]}55`;
  document.body.appendChild(rip);
  rip.addEventListener('animationend', () => rip.remove());

  // Refresh drifter colors to match theme
  drifters.forEach(d => {
    d.color = currentTheme.palettes[0][Math.floor(Math.random() * 5)];
  });
}

// ── Render loop ───────────────────────────────────────
function tick() {
  requestAnimationFrame(tick);
  if (paused) return;
  frame++;

  // Background with slight persistence (trails)
  ctx.fillStyle = currentTheme.bg + 'dd';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  for (const s of stars) {
    s.phase += s.twinkleSpeed;
    const a = s.alpha * (0.5 + 0.5 * Math.sin(s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }

  // Drifters
  for (const d of drifters) {
    d.update();
    d.draw(ctx);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].dead) particles.splice(i, 1);
  }

  // Occasional ambient burst
  if (frame % 240 === 0 && particles.length < 200) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height * 0.7 + canvas.height * 0.15;
    explode(x, y);
  }

  statsEl.textContent = `${particles.length} particles`;
}
tick();

// ── Input ─────────────────────────────────────────────
canvas.addEventListener('click', e => {
  explode(e.clientX, e.clientY);
});

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.touches) {
    explode(t.clientX, t.clientY);
  }
}, { passive: false });

window.addEventListener('keydown', e => {
  switch (e.key.toLowerCase()) {
    case 't': setTheme((themeIndex + 1) % THEMES.length); break;
    case 'c': particles.length = 0; break;
    case ' ':
      e.preventDefault();
      paused = !paused;
      break;
  }
});
</script>
</body>
</html>
